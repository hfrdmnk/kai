name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Package extension
        run: cd dist/extension && zip -r ../kai-extension.zip .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$(cat <<EOF
          ## Install

          Download \`kai-extension.zip\`, unzip it, open \`chrome://extensions\`, turn on Developer mode and choose Load unpacked.

          See [CHANGELOG.md](https://github.com/hfrdmnk/kai/blob/main/CHANGELOG.md) for details.
          EOF
          )" \
            dist/kai-extension.zip
