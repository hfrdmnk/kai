<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>kai — Components</title>
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='80'>回</text></svg>" />
		<style>
			:root {
				--white: oklch(100% 0 0);
				--gray-50: oklch(98.5% 0.002 247.839);
				--gray-100: oklch(96.7% 0.003 264.542);
				--gray-200: oklch(92.8% 0.006 264.531);
				--gray-300: oklch(87.2% 0.01 258.338);
				--gray-400: oklch(70.7% 0.022 261.325);
				--gray-500: oklch(55.1% 0.027 264.364);
				--gray-600: oklch(44.6% 0.03 256.802);
				--gray-700: oklch(37.3% 0.034 259.733);
				--gray-800: oklch(27.8% 0.033 256.848);
				--gray-900: oklch(21% 0.034 264.665);
				--gray-950: oklch(13% 0.028 261.692);
				--color-accent: oklch(0.6927 0.2513 38.8022);
				--font-sans: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
				--font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
				--text-primary: var(--gray-900);
				--text-secondary: var(--gray-600);
				--text-tertiary: var(--gray-500);
			}

			*, *::before, *::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family: var(--font-sans);
				color: var(--text-primary);
				background: var(--white);
				line-height: 1.5;
				-webkit-font-smoothing: antialiased;
				padding: 64px 48px 120px;
			}

			.page-header {
				margin-bottom: 64px;
			}

			.page-header h1 {
				font-size: 28px;
				font-weight: 600;
				margin-bottom: 4px;
			}

			.page-header p {
				font-size: 15px;
				color: var(--text-secondary);
			}

			.section {
				margin-bottom: 64px;
			}

			.section-title {
				font-size: 13px;
				font-weight: 600;
				color: var(--text-tertiary);
				text-transform: uppercase;
				letter-spacing: 0.06em;
				margin-bottom: 20px;
				padding-bottom: 8px;
				border-bottom: 1px solid var(--gray-200);
			}

			.specimen {
				margin-bottom: 32px;
			}

			.specimen-label {
				font-size: 12px;
				font-family: var(--font-mono);
				color: var(--text-tertiary);
				margin-bottom: 10px;
			}

			.specimen-row {
				display: flex;
				align-items: center;
				gap: 16px;
				flex-wrap: wrap;
			}

			.specimen-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
				gap: 12px;
			}

			.specimen-mount {
				/* Shadow DOM containers get mounted here */
			}
		</style>
	</head>
	<body>
		<div class="page-header">
			<h1>kai — Components</h1>
			<p>Internal component catalog for design review</p>
		</div>

		<div class="section">
			<div class="section-title">1. Color Palette</div>
			<div id="mount-colors" class="specimen-mount"></div>
		</div>

		<div class="section">
			<div class="section-title">2. Typography</div>
			<div id="mount-typography" class="specimen-mount"></div>
		</div>

		<div class="section">
			<div class="section-title">3. Shadows</div>
			<div id="mount-shadows" class="specimen-mount"></div>
		</div>

		<div class="section">
			<div class="section-title">4. Icons</div>
			<div id="mount-icons" class="specimen-mount"></div>
		</div>

		<div class="section">
			<div class="section-title">5. Buttons</div>
			<div id="mount-buttons" class="specimen-mount"></div>
		</div>

		<div class="section">
			<div class="section-title">6. FAB</div>
			<div id="mount-fab" class="specimen-mount"></div>
		</div>

		<div class="section">
			<div class="section-title">7. FAB Actions</div>
			<div id="mount-fab-actions" class="specimen-mount"></div>
		</div>

		<div class="section">
			<div class="section-title">8. Tooltip</div>
			<div id="mount-tooltip" class="specimen-mount"></div>
		</div>

		<div class="section">
			<div class="section-title">9. Overlay</div>
			<div id="mount-overlay" class="specimen-mount"></div>
		</div>

		<div class="section">
			<div class="section-title">10. Popover</div>
			<div id="mount-popover" class="specimen-mount"></div>
		</div>

		<div class="section">
			<div class="section-title">11. Markers</div>
			<div id="mount-markers" class="specimen-mount"></div>
		</div>

		<div class="section">
			<div class="section-title">12. Stack Expanded</div>
			<div id="mount-stack-expanded" class="specimen-mount"></div>
		</div>

		<div class="section">
			<div class="section-title">13. Annotation Box</div>
			<div id="mount-annotation-box" class="specimen-mount"></div>
		</div>

		<div class="section">
			<div class="section-title">14. Autocomplete</div>
			<div id="mount-autocomplete" class="specimen-mount"></div>
		</div>

		<div class="section">
			<div class="section-title">15. Measurement Tools</div>
			<div id="mount-measure" class="specimen-mount"></div>
		</div>

		<div class="section">
			<div class="section-title">16. Guide Bar</div>
			<div id="mount-guide-bar" class="specimen-mount"></div>
		</div>

		<script type="module" src="/src/components-page.ts"></script>
	</body>
</html>
